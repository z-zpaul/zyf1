<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="周奕帆 · 山东大学材料科学与工程 2026届 · 个人简历">
<meta name="theme-color" content="#1e4a6b">
<title>周奕帆 · 个人简历 | 山东大学 材料科学与工程 2026届</title>
<style>
/* ============================================================
   设计令牌
   ============================================================ */
:root{
  --bg:#f5f8fb;
  --surface:#ffffff;
  --surface-2:#edf2f8;
  --text:#0d1b2a;
  --text-2:#46586c;
  --text-3:#8998aa;
  --border:#e2e9f1;
  --primary:#1e4a6b;
  --primary-2:#2f6d99;
  --primary-soft:#e8f0f7;
  --accent:#d97706;
  --accent-2:#f59e0b;
  --accent-soft:#fdf2e0;
  --shadow-1:0 1px 2px rgba(13,27,42,.04), 0 2px 8px rgba(13,27,42,.045);
  --shadow-2:0 10px 28px rgba(13,27,42,.09), 0 2px 8px rgba(13,27,42,.045);
  --shadow-3:0 20px 48px rgba(13,27,42,.14);
  --r-lg:18px;
  --r-md:14px;
  --r-sm:10px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --t:200ms var(--ease);
  --nav-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono","Fira Code","Cascadia Code",Consolas,"Liberation Mono",monospace;
}
[data-theme="dark"]{
  --bg:#0a1120;
  --surface:#121c2e;
  --surface-2:#1a2740;
  --text:#e9f0f8;
  --text-2:#a6b5c8;
  --text-3:#6d7e94;
  --border:#22314a;
  --primary:#6fa8d0;
  --primary-2:#8ec2e4;
  --primary-soft:#152740;
  --accent:#f0a83c;
  --accent-2:#fbbf24;
  --accent-soft:#2e2411;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 10px 28px rgba(0,0,0,.45);
  --shadow-3:0 20px 48px rgba(0,0,0,.55);
}

/* ============================================================
   基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{
  scroll-behavior:smooth;
  scroll-padding-top:calc(var(--nav-h) + 16px);
  -webkit-text-size-adjust:100%;
}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  font-size:15px;
  padding-top:var(--nav-h);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background var(--t),color var(--t);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(760px 520px at 12% -6%,rgba(30,74,107,.10),transparent 62%),
    radial-gradient(620px 460px at 96% 8%,rgba(217,119,6,.07),transparent 60%),
    radial-gradient(700px 600px at 50% 108%,rgba(47,109,153,.07),transparent 64%);
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(760px 520px at 12% -6%,rgba(111,168,208,.14),transparent 62%),
    radial-gradient(620px 460px at 96% 8%,rgba(240,168,60,.09),transparent 60%),
    radial-gradient(700px 600px at 50% 108%,rgba(111,168,208,.08),transparent 64%);
}
h1,h2,h3,h4{line-height:1.25;font-weight:700;letter-spacing:-.015em;}
a{color:var(--primary-2);text-decoration:none;transition:color var(--t);}
a:hover{color:var(--accent);}
ul{list-style:none;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);color:var(--accent);}

.container{max-width:1080px;margin:0 auto;padding:0 24px;}

/* ============================================================
   导航栏
   ============================================================ */
.navbar{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:1000;
  background:color-mix(in srgb,var(--surface) 78%,transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border);
  transition:background var(--t),border-color var(--t),box-shadow var(--t);
}
.navbar.scrolled{box-shadow:var(--shadow-1);}
.nav-inner{
  max-width:1080px;margin:0 auto;padding:0 24px;height:100%;
  display:flex;align-items:center;gap:16px;
}
.brand{
  font-weight:800;font-size:1.06rem;letter-spacing:-.02em;
  color:var(--text);white-space:nowrap;flex-shrink:0;
}
.brand span{color:var(--accent);}
.nav-links{
  display:flex;gap:2px;flex:1;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
.nav-links::-webkit-scrollbar{display:none;}
.nav-links a{
  display:block;padding:7px 13px;border-radius:9px;font-size:.845rem;
  font-weight:500;color:var(--text-2);white-space:nowrap;
  transition:background var(--t),color var(--t);
}
.nav-links a:hover,.nav-links a:focus-visible{
  background:var(--primary-soft);color:var(--primary);outline:none;
}
.nav-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:all var(--t);
}
.icon-btn:hover{
  background:var(--primary-soft);color:var(--primary);
  border-color:var(--primary-2);transform:translateY(-1px);
}
.icon-btn:active{transform:translateY(0) scale(.97);}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.icon-btn svg{width:17px;height:17px;}

/* ============================================================
   通用区块
   ============================================================ */
main{padding-bottom:24px;}
section{
  margin-bottom:54px;
  animation:rise .55s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
section:nth-of-type(1){animation-delay:.02s;}
section:nth-of-type(2){animation-delay:.06s;}
section:nth-of-type(3){animation-delay:.1s;}
section:nth-of-type(4){animation-delay:.14s;}
section:nth-of-type(5){animation-delay:.18s;}
section:nth-of-type(6){animation-delay:.22s;}

.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.sec-head .dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 0 4px var(--accent-soft);
}
.sec-head h2{font-size:1.32rem;color:var(--text);white-space:nowrap;}
.sec-head .line{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border),transparent);
}

/* ============================================================
   Hero
   ============================================================ */
.hero{
  display:grid;grid-template-columns:1fr auto;gap:36px;align-items:start;
  padding:52px 0 8px;
}
.hero-tag{
  display:inline-block;font-size:.79rem;font-weight:600;letter-spacing:.06em;
  color:var(--accent);text-transform:uppercase;margin-bottom:10px;
  padding:4px 12px;border-radius:100px;background:var(--accent-soft);
}
.hero-name{
  font-size:clamp(2rem,5.6vw,2.85rem);letter-spacing:-.035em;
  margin-bottom:16px;color:var(--text);
  background:linear-gradient(135deg,var(--text) 20%,var(--primary-2) 90%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
[data-theme="dark"] .hero-name{
  background:linear-gradient(135deg,var(--text) 20%,var(--primary-2) 90%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero-summary{
  font-size:.945rem;color:var(--text-2);max-width:640px;
  margin-bottom:20px;line-height:1.78;
}
.badge-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:100px;font-size:.785rem;font-weight:600;
  background:var(--primary-soft);color:var(--primary);
  border:1px solid transparent;transition:all var(--t);
}
.badge::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:currentColor;opacity:.55;
}
.badge.accent{background:var(--accent-soft);color:var(--accent);}
.badge:hover{transform:translateY(-2px);border-color:currentColor;}
.contact-row{display:flex;flex-wrap:wrap;gap:10px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 18px;border-radius:12px;font-size:.845rem;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  cursor:pointer;white-space:nowrap;transition:all var(--t);
  text-decoration:none;
}
.btn svg{width:15px;height:15px;flex-shrink:0;}
.btn:hover{
  background:var(--primary-soft);border-color:var(--primary-2);
  color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-1);
}
.btn:active{transform:translateY(0);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border-color:transparent;
}
.btn-primary:hover{
  color:#fff;background:linear-gradient(135deg,var(--primary-2),var(--primary));
  box-shadow:var(--shadow-2);
}
.hero-avatar{
  width:104px;height:104px;border-radius:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;font-weight:800;color:#fff;user-select:none;
  background:linear-gradient(140deg,var(--primary),var(--primary-2) 55%,var(--accent));
  box-shadow:var(--shadow-2);
  position:relative;overflow:hidden;
}
.hero-avatar::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(140deg,rgba(255,255,255,.28),transparent 55%);
}

/* ============================================================
   亮点成果
   ============================================================ */
.hl-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:16px;
}
.hl-card{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:20px 18px 18px;
  box-shadow:var(--shadow-1);transition:all var(--t);
}
.hl-card::before{
  content:"";position:absolute;top:0;left:0;width:4px;height:100%;
  background:linear-gradient(180deg,var(--primary),var(--accent));
  border-radius:0 3px 3px 0;
}
.hl-card:hover{
  transform:translateY(-5px);box-shadow:var(--shadow-2);
  border-color:var(--primary-2);
}
.hl-num{
  font-size:1.75rem;font-weight:800;letter-spacing:-.04em;line-height:1.15;
  color:var(--primary);margin-bottom:6px;
}
[data-theme="dark"] .hl-num{color:var(--primary-2);}
.hl-desc{font-size:.83rem;color:var(--text-2);line-height:1.55;}

/* ============================================================
   Tabs
   ============================================================ */
.tabs{
  display:flex;gap:4px;border-bottom:1px solid var(--border);
  margin-bottom:20px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  padding:10px 18px;font-size:.845rem;font-weight:600;
  color:var(--text-2);background:transparent;border:none;
  border-bottom:2px solid transparent;cursor:pointer;
  white-space:nowrap;border-radius:9px 9px 0 0;
  transition:all var(--t);
}
.tab-btn:hover{color:var(--primary);background:var(--primary-soft);}
.tab-btn[aria-selected="true"]{
  color:var(--primary);border-bottom-color:var(--accent);
}
.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:rise .4s var(--ease) both;}

/* ============================================================
   经历卡片
   ============================================================ */
.exp-list{display:flex;flex-direction:column;gap:16px;}
.exp-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:24px 26px;
  box-shadow:var(--shadow-1);transition:all var(--t);
  position:relative;
}
.exp-card::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--primary-2),transparent);
  border-radius:var(--r-lg) 0 0 var(--r-lg);
  opacity:0;transition:opacity var(--t);
}
.exp-card:hover{
  transform:translateY(-4px);box-shadow:var(--shadow-2);
  border-color:var(--primary-2);
}
.exp-card:hover::after{opacity:1;}
.exp-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:10px;margin-bottom:14px;
}
.exp-title{font-size:1.06rem;font-weight:700;color:var(--text);}
.exp-org{
  font-size:.85rem;color:var(--primary-2);font-weight:600;margin-top:3px;
}
.exp-date{
  font-size:.76rem;font-weight:600;color:var(--text-3);
  background:var(--surface-2);padding:4px 13px;border-radius:100px;
  white-space:nowrap;letter-spacing:.01em;
}
.exp-points{display:flex;flex-direction:column;gap:8px;}
.exp-points li{
  position:relative;padding-left:19px;font-size:.885rem;
  color:var(--text-2);line-height:1.68;
}
.exp-points li::before{
  content:"";position:absolute;left:0;top:9px;
  width:6px;height:6px;border-radius:50%;
  background:var(--primary-2);opacity:.6;
}

/* ============================================================
   项目卡片
   ============================================================ */
.proj-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;
}
.proj-card{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:24px 22px 22px;
  box-shadow:var(--shadow-1);transition:all var(--t);
}
.proj-card:hover{
  transform:translateY(-5px);box-shadow:var(--shadow-2);
  border-color:var(--primary-2);
}
.proj-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;margin-bottom:6px;
}
.proj-name{font-size:1.02rem;font-weight:700;color:var(--text);}
.proj-date{
  font-size:.72rem;font-weight:600;color:var(--text-3);white-space:nowrap;
  background:var(--surface-2);padding:3px 11px;border-radius:100px;
}
.proj-role{
  font-size:.8rem;font-weight:600;color:var(--accent);margin-bottom:10px;
}
.tech-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tech-tag{
  font-size:.72rem;font-weight:600;padding:3px 11px;border-radius:100px;
  background:var(--accent-soft);color:var(--accent);
  transition:transform var(--t);
}
.tech-tag:hover{transform:translateY(-1px);}
.proj-desc{
  font-size:.855rem;color:var(--text-2);line-height:1.7;margin-bottom:14px;
}
.proj-results{
  display:flex;flex-direction:column;gap:7px;
  padding-top:14px;border-top:1px dashed var(--border);
}
.proj-results li{
  position:relative;padding-left:19px;
  font-size:.835rem;color:var(--text-2);line-height:1.62;
}
.proj-results li::before{
  content:"";position:absolute;left:0;top:8px;
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);opacity:.75;
}
.proj-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  font-size:.8rem;font-weight:600;color:var(--primary-2);
}
.proj-link svg{width:13px;height:13px;}

/* ============================================================
   技能矩阵
   ============================================================ */
.skills-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:18px;
}
.skill-cat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:22px 22px 18px;
  box-shadow:var(--shadow-1);transition:all var(--t);
}
.skill-cat:hover{
  transform:translateY(-4px);box-shadow:var(--shadow-2);
  border-color:var(--primary-2);
}
.skill-cat h3{
  font-size:.875rem;font-weight:700;color:var(--primary);
  margin-bottom:16px;display:flex;align-items:center;gap:9px;
}
.skill-cat h3 svg{width:15px;height:15px;flex-shrink:0;}
.skill-item{margin-bottom:13px;}
.skill-item:last-child{margin-bottom:0;}
.skill-label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:.795rem;color:var(--text-2);margin-bottom:6px;gap:10px;
}
.skill-label .pct{
  font-family:var(--mono);font-size:.72rem;font-weight:600;
  color:var(--text-3);
}
.skill-bar{
  height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;
}
.skill-fill{
  height:100%;width:0;border-radius:100px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  transition:width .85s var(--ease);
}
.skill-fill.alt{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
}

/* ============================================================
   教育与证书
   ============================================================ */
.edu-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:24px 26px;
  box-shadow:var(--shadow-1);transition:all var(--t);
}
.edu-card:hover{box-shadow:var(--shadow-2);border-color:var(--primary-2);}
.edu-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:10px;margin-bottom:6px;
}
.edu-school{font-size:1.08rem;font-weight:700;color:var(--text);}
.edu-major{font-size:.86rem;font-weight:600;color:var(--primary-2);margin-top:3px;}
.edu-date{
  font-size:.76rem;font-weight:600;color:var(--text-3);
  background:var(--surface-2);padding:4px 13px;border-radius:100px;
  white-space:nowrap;
}
.course-label{
  font-size:.78rem;font-weight:700;color:var(--text-3);
  letter-spacing:.05em;text-transform:uppercase;
  margin:18px 0 10px;
}
.course-tags{display:flex;flex-wrap:wrap;gap:7px;}
.course-tag{
  font-size:.775rem;font-weight:500;padding:4px 13px;border-radius:100px;
  background:var(--surface-2);color:var(--text-2);
  border:1px solid var(--border);transition:all var(--t);
}
.course-tag:hover{border-color:var(--accent);color:var(--accent);}
.edu-notes{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.edu-notes li{
  position:relative;padding-left:19px;
  font-size:.865rem;color:var(--text-2);line-height:1.66;
}
.edu-notes li::before{
  content:"";position:absolute;left:0;top:9px;
  width:6px;height:6px;border-radius:50%;
  background:var(--primary-2);opacity:.6;
}
.cert-block{margin-top:22px;padding-top:20px;border-top:1px dashed var(--border);}

/* ============================================================
   返回顶部 & 提示
   ============================================================ */
.back-top{
  position:fixed;right:26px;bottom:26px;z-index:900;
  width:44px;height:44px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-2);transition:all var(--t);
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.9);
}
.back-top svg{width:19px;height:19px;}
.back-top.show{opacity:1;pointer-events:auto;transform:none;}
.back-top:hover{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  transform:translateY(-3px);box-shadow:var(--shadow-3);
}
.back-top:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.toast{
  position:fixed;left:50%;bottom:88px;z-index:2000;
  transform:translateX(-50%) translateY(16px);
  padding:10px 24px;border-radius:100px;
  background:var(--primary);color:#fff;font-size:.815rem;font-weight:600;
  box-shadow:var(--shadow-3);opacity:0;pointer-events:none;
  transition:all .28s var(--ease);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============================================================
   页脚
   ============================================================ */
footer{
  border-top:1px solid var(--border);
  padding:28px 0 36px;text-align:center;
  font-size:.78rem;color:var(--text-3);line-height:1.9;
}
footer .fname{color:var(--text-2);font-weight:600;}

/* ============================================================
   工具类
   ============================================================ */
.hidden{display:none !important;}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:24px;padding-top:36px;}
  .hero-avatar{width:76px;height:76px;font-size:1.85rem;border-radius:20px;}
  .proj-grid{grid-template-columns:1fr;}
}
@media (max-width:768px){
  :root{--nav-h:56px;}
  body{font-size:14.5px;}
  .nav-inner{padding:0 14px;gap:10px;}
  .brand{font-size:.98rem;}

function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function make(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

  if (c.portfolio) items.push({ label: '作品集',   value: '查看主页',  href: c.portfolio,           icon: ICONS.link });

  hero.innerHTML =
    '<div class="hero-main">' +
      '<span class="hero-tag">' + esc(resume.title) + '</span>' +
      '<h1 class="hero-name">' + esc(resume.name) + '</h1>' +

    '</div>' +
    '<div class="hero-avatar" aria-hidden="true">' + esc(resume.avatar) + '</div>';

  const row = $('#contactRow');
  if (!items.length) { row.remove(); return; }

  items.forEach(function (it) {
    if (it.copy) {
      const btn = make('button', 'btn');
      btn.type = 'button';
      btn.innerHTML = ICONS.copy + '<span>复制邮箱</span>';
      btn.addEventListener('click', function () { copyEmail(c.email); });
      row.appendChild(btn);
      return;
    }
    if (it.href) {
      const a = make('a', 'btn');
      a.href = it.href;
      if (/^https?:/.test(it.href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      a.innerHTML = it.icon + '<span>' + esc(it.label) + '</span>';
      row.appendChild(a);
      return;
    }
    const s = make('span', 'btn');
    s.innerHTML = it.icon + '<span>' + esc(it.label + '：' + it.value) + '</span>';
    row.appendChild(s);

  const done = function () { showToast('邮箱已复制：' + addr); };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(addr).then(done).catch(function () { legacyCopy(addr, done); });
  } else {
    legacyCopy(addr, done);
  }
}
function legacyCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { showToast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

/* ============================================================
   4. 渲染：亮点成果
   ============================================================ */
function renderHighlights() {

/* ============================================================
   5. 通用 Tabs 构建器
   ============================================================ */
function buildTabs(barId, wrapId, tabs, renderPanel) {
  const bar  = document.getElementById(barId);
  const wrap = document.getElementById(wrapId);
  const avail = (tabs || []).filter(function (t) { return t.items && t.items.length; });

  if (!avail.length) {
    bar.parentElement.classList.add('hidden');
    return;
  }

  bar.innerHTML = '';
  wrap.innerHTML = '';

  const btns = [];
  const panels = [];

  avail.forEach(function (tab, i) {
    const btn = make('button', 'tab-btn');
    btn.type = 'button';
    btn.id = 'tab-' + tab.id;
    btn.textContent = tab.label;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-controls', 'panel-' + tab.id);
    btn.tabIndex = i === 0 ? 0 : -1;

    const panel = make('div', 'tab-panel' + (i === 0 ? ' active' : ''));
    panel.id = 'panel-' + tab.id;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-' + tab.id);
    panel.tabIndex = 0;

    renderPanel(panel, tab);

    btn.addEventListener('click', function () {
      btns.forEach(function (b) {
        b.setAttribute('aria-selected', 'false');
        b.tabIndex = -1;
      });
      panels.forEach(function (p) { p.classList.remove('active'); });
      btn.setAttribute('aria-selected', 'true');
      btn.tabIndex = 0;
      panel.classList.add('active');
    });

    bar.appendChild(btn);
    wrap.appendChild(panel);
    btns.push(btn);
    panels.push(panel);
  });

  /* 键盘左右切换 */
  bar.addEventListener('keydown', function (e) {
    const idx = btns.indexOf(document.activeElement);
    if (idx === -1) return;
    let next = null;
    if (e.key === 'ArrowRight')      next = (idx + 1) % btns.length;
    else if (e.key === 'ArrowLeft')  next = (idx - 1 + btns.length) % btns.length;
    else if (e.key === 'Home')       next = 0;
    else if (e.key === 'End')        next = btns.length - 1;
    if (next !== null) {
      e.preventDefault();
      btns[next].focus();
      btns[next].click();
    }
  });
}

/* ============================================================
   6. 渲染：经历
   ============================================================ */
function renderExperience() {
  const sec = $('#experience');
  const tabs = (resume.experience && resume.experience.tabs) || [];
  const avail = tabs.filter(function (t) { return t.items && t.items.length; });

  if (!avail.length) { sec.classList.add('hidden'); return; }

  sec.innerHTML = secHead('经历') +
    '<div class="tabs" role="tablist" aria-label="经历分类" id="expTabs"></div>' +
    '<div id="expPanels"></div>';

  buildTabs('expTabs', 'expPanels', tabs, function (panel, tab) {
    const list = make('div', 'exp-list');
    tab.items.forEach(function (item) {
      const card = make('article', 'exp-card');
      card.innerHTML =
        '<div class="exp-top">' +
          '<div>' +
            '<div class="exp-title">' + esc(item.title) + '</div>' +
            (item.org ? '<div class="exp-org">' + esc(item.org) + '</div>' : '') +
          '</div>' +
          (item.date ? '<span class="exp-date">' + esc(item.date) + '</span>' : '') +
        '</div>' +
        '<ul class="exp-points">' +
          (item.points || []).map(function (p) {
            return '<li>' + esc(p) + '</li>';
          }).join('') +
        '</ul>';
      list.appendChild(card);
    });
    panel.appendChild(list);
  });
}

/* ============================================================
   7. 渲染：项目
   ============================================================ */
function renderProjects() {
  const sec = $('#projects');
  const tabs = (resume.projects && resume.projects.tabs) || [];
  const avail = tabs.filter(function (t) { return t.items && t.items.length; });

  if (!avail.length) { sec.classList.add('hidden'); return; }

  sec.innerHTML = secHead('项目') +
    '<div class="tabs" role="tablist" aria-label="项目分类" id="projTabs"></div>' +
    '<div id="projPanels"></div>';

  buildTabs('projTabs', 'projPanels', tabs, function (panel, tab) {
    const grid = make('div', 'proj-grid');
    tab.items.forEach(function (p) {
      const card = make('article', 'proj-card');
      card.innerHTML =
        '<div class="proj-head">' +

        '</div>' +
        (p.role ? '<div class="proj-role">' + esc(p.role) + '</div>' : '') +
        ((p.stack && p.stack.length)
          ? '<div class="tech-row">' + p.stack.map(function (s) {
              return '<span class="tech-tag">' + esc(s) + '</span>';
            }).join('') + '</div>'
          : '') +
        (p.desc ? '<p class="proj-desc">' + esc(p.desc) + '</p>' : '') +
        ((p.results && p.results.length)
          ? '<ul class="proj-results">' + p.results.map(function (r) {
              return '<li>' + esc(r) + '</li>';
            }).join('') + '</ul>'
          : '') +
        (p.link
          ? '<a class="proj-link" href="' + esc(p.link) + '" target="_blank" rel="noopener noreferrer">' +
              ICONS.link + '<span>查看项目</span></a>'
          : '');
      grid.appendChild(card);
    });
    panel.appendChild(grid);

/* ============================================================
   8. 渲染：技能矩阵
   ============================================================ */
function renderSkills() {
  const sec = $('#skills');
  const groups = (resume.skills || []).filter(function (g) {
    return g.items && g.items.length;
  });
  if (!groups.length) { sec.classList.add('hidden'); return; }

  sec.innerHTML = secHead('技能矩阵') +
    '<div class="skills-grid">' +
      groups.map(function (g) {
        return '<div class="skill-cat">' +
                 '<h3>' + (ICONS[g.icon] || ICONS.spark) + '<span>' + esc(g.group) + '</span></h3>' +
                 g.items.map(function (it) {
                   return '<div class="skill-item">' +
                            '<div class="skill-label">' +
                              '<span>' + esc(it.name) + '</span>' +
                              '<span class="pct">' + esc(it.level) + '%</span>' +
                            '</div>' +
                            '<div class="skill-bar">' +
                              '<div class="skill-fill' + (it.alt ? ' alt' : '') + '"' +
                                   ' data-w="' + esc(it.level) + '"></div>' +
                            '</div>' +
                          '</div>';
                 }).join('') +
               '</div>';
      }).join('') +
    '</div>';

  /* 进度条动画 */
  const fills = $$('.skill-fill');
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      fills.forEach(function (f, i) {
        const w = parseFloat(f.dataset.w) || 0;
        setTimeout(function () { f.style.width = w + '%'; }, 80 + i * 45);
      });
    });
  });
}

/* ============================================================
   9. 渲染：教育与证书
   ============================================================ */
function renderEducation() {
  const sec = $('#education');
  const edu = resume.education;
  const certs = resume.certificates || [];

  if (!edu && !certs.length) { sec.classList.add('hidden'); return; }

  let html = secHead('教育与证书');

  if (edu) {
    html +=
      '<div class="edu-card">' +
        '<div class="edu-top">' +
          '<div>' +
            '<div class="edu-school">' + esc(edu.school) + '</div>' +
            '<div class="edu-major">' + esc(edu.major) + ' · ' + esc(edu.degree) + '</div>' +
          '</div>' +
          (edu.date ? '<span class="edu-date">' + esc(edu.date) + '</span>' : '') +
        '</div>' +
        ((edu.courses && edu.courses.length)
          ? '<div class="course-label">核心课程</div>' +
            '<div class="course-tags">' +
              edu.courses.map(function (c) {
                return '<span class="course-tag">' + esc(c) + '</span>';
              }).join('') +
            '</div>'
          : '') +
        ((edu.notes && edu.notes.length)
          ? '<ul class="edu-notes">' +
              edu.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') +
            '</ul>'
          : '') +
      '</div>';
  }

  if (certs.length) {
    html +=
      '<div class="edu-card cert-block">' +
        '<div class="course-label" style="margin-top:0;">证书 / 荣誉</div>' +
        '<div class="course-tags">' +
          certs.map(function (c) {
            return '<span class="course-tag">' + esc(c) + '</span>';
          }).join('') +
        '</div>' +
      '</div>';
  }

  sec.innerHTML = html;
}

/* ============================================================
   10. 主题切换
   ============================================================ */
const SUN_ICON =
  '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const icon = $('#themeIcon');
  icon.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a1120' : '#1e4a6b');
  try { localStorage.setItem('zyf-theme', theme); } catch (e) {}
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('zyf-theme'); } catch (e) {}
  if (saved === 'dark' || saved === 'light') {
    applyTheme(saved);
    return;
  }
  const prefersDark = window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}

/* ============================================================
   11. 交互：滚动、返回顶部、打印
   ============================================================ */
function initScrollUI() {
  const backTop = $('#backTop');
  const navbar = $('#navbar');

  function onScroll() {
    const y = window.scrollY || document.documentElement.scrollTop;
    backTop.classList.toggle('show', y > 420);
    navbar.classList.toggle('scrolled', y > 8);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  backTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function initPrint() {
  $('#printBtn').addEventListener('click', function () {
    /* 打印前确保所有 Tab 面板可见（打印样式已处理），
       同时触发一次宽度重算，避免进度条为 0 */
    $$('.skill-fill').forEach(function (f) {
      const w = parseFloat(f.dataset.w) || 0;
      f.style.width = w + '%';
    });
    window.print();
  });
}

/* ============================================================
   12. 启动
   ============================================================ */
function init() {
  initTheme();
  renderNav();
  renderHero();
  renderHighlights();
  renderExperience();
  renderProjects();
  renderSkills();
  renderEducation();
  initScrollUI();
  initPrint();

  $('#themeBtn').addEventListener('click', function () {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  $('#year').textContent = new Date().getFullYear();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
